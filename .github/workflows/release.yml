# Builds the Windows installer for a version tag and attaches it to a draft
# GitHub release, with the latest.yml the app's updater reads. Publishing the
# draft is what makes it the version everyone is offered.
#
#   npm version 0.3.0 && git push --follow-tags

name: Release

on:
  push:
    tags: ['v*']

# Nothing by default; the one job that publishes asks for what it needs.
permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Pinned to the exact commit of a release, as in test.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache: the installer people download is built from a clean
          # install, never from files an earlier run left behind.
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
