<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents Dashboard</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>
    <aside class="sidebar">
      <div class="rail" id="workspace-rail"></div>
      <div class="rail" id="agent-rail" hidden></div>
      <div class="rail" id="chat-rail" hidden></div>
      <div class="account" id="account"></div>
    </aside>
    <main class="main">
      <section class="code-view" id="code-view">
        <div class="canvas" id="canvas"></div>
        <div class="empty" id="empty" hidden>
          <div class="empty-title" id="empty-title">No workspace yet</div>
          <div class="empty-text" id="empty-text">Click + next to Workspaces to add a project folder.</div>
        </div>
      </section>
      <section class="agent-view" id="agent-view" hidden></section>
      <section class="chat-view" id="chat-view" hidden></section>
    </main>
  </div>
  <div class="banner" id="banner" hidden>Reconnecting…</div>
  <div class="stopped" id="stopped" hidden>
    <div class="empty-title">Dashboard stopped</div>
    <div class="empty-text">All agents were stopped. Open the Agents Dashboard shortcut to start again.</div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
